name: thinkly_app
description: "Thinkly AI - Voice-to-Voice AI Debate Arena with Animated Vector Mascot & Live Multimodal Streaming."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_animate: ^4.5.2
  webview_flutter: ^4.10.0
  web_socket_channel: ^3.0.1
  record: ^7.1.2
  flutter_pcm_sound: ^3.3.3
  permission_handler: ^13.0.0
  google_fonts: ^6.2.1

  # Production shared modules for Thinkly suite (future merge compatibility)
  flutter_dotenv: ^5.2.1
  http: ^1.2.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  flutter_markdown: ^0.7.4
  web: ^1.1.0
  pdf: ^3.11.1
  printing: ^5.13.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/avatar/
    - assets/avatar/bible_strong_avatar.js
    - assets/avatar/avatar.html
    - .env
