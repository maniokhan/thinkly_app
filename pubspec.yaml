name: thinkly_app
description: "Thinkly - AI Live Lecture Mind Map & Production PDF Notes Generator."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  provider: ^6.1.2
  http: ^1.2.2
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  flutter_markdown: ^0.7.4
  web: ^1.1.0
  pdf: ^3.11.1
  printing: ^5.13.2
  intl: ^0.19.0
  flutter_animate: ^4.5.2
  fl_chart: ^1.3.0
  flutter_foreground_task: ^11.0.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  permission_handler: ^13.0.2
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  archive: ^4.0.12

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/fonts/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf

