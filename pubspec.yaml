publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  provider: ^6.1.2
  http: ^1.2.2
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  flutter_markdown: ^0.7.4
  web: ^1.1.0
  pdf: ^3.11.1
  printing: ^5.13.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env

